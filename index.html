<style>

body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 15% 15%,#174a73 0,#0b2135 28%,transparent 48%),radial-gradient(circle at 85% 80%,#123e4c 0,transparent 40%),linear-gradient(135deg,#06111d,#091827 55%,#06111d)}

/* HOME */
.home{min-height:100vh;display:grid;place-items:center;padding:28px}.hero{width:min(1120px,100%);position:relative}.hero-card{background:linear-gradient(145deg,#0c2032ee,#071522f2);border:1px solid #315875;border-radius:30px;padding:46px;box-shadow:var(--shadow);overflow:hidden}.hero-card:before{content:"";position:absolute;width:500px;height:500px;right:-180px;top:-220px;border-radius:50%;background:#1b8ac822;filter:blur(5px)}.eyebrow{font-size:12px;letter-spacing:2px;color:#75c7ff;font-weight:800}.hero h1{font-size:clamp(36px,6vw,68px);line-height:1.02;margin:15px 0 12px;max-width:850px}.hero p{max-width:750px;color:#adc1d3;line-height:1.7}.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px}.role{position:relative;padding:26px;border:1px solid #31516a;background:#0d1d2df2;border-radius:20px;transition:.2s;min-height:210px}.role:hover{transform:translateY(-4px);border-color:#4d9fd0;box-shadow:0 15px 35px #0005}.role-icon{font-size:38px;width:64px;height:64px;display:grid;place-items:center;border-radius:18px;background:#17334b}.role h2{margin:18px 0 6px}.role p{font-size:13px;margin:0 0 18px}.btn{border:0;border-radius:10px;padding:11px 16px;background:linear-gradient(135deg,#2e9cff,#1c75d4);color:#fff;font-weight:800;box-shadow:0 8px 20px #168cf433}.btn.gold{background:linear-gradient(135deg,#ffc857,#e89d2f);color:#17202a}.btn.red{background:#7b2636}.ghost{border:1px solid #31506a;background:#0b1b2a;color:#dcecff;border-radius:9px;padding:9px 12px}.home-foot{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;color:#8098ad;font-size:11px}.pill{padding:5px 8px;border:1px solid #294860;border-radius:999px;background:#0b1b29}
/* APP */
.app{min-height:100vh}.top{height:68px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#071522ee;backdrop-filter:blur(14px);border-bottom:1px solid #23435c}.brand{font-weight:900;letter-spacing:.8px}.brand small{display:block;font-size:9px;color:#7893aa;letter-spacing:1.5px;margin-top:3px}.top-actions{display:flex;gap:9px;align-items:center}.status{font-size:11px;color:var(--green);font-weight:800}.layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 68px)}.side{border-right:1px solid #1f3a50;background:#081625e8;padding:15px 10px;position:sticky;top:68px;height:calc(100vh - 68px);overflow:auto}.side .section{font-size:9px;letter-spacing:1.7px;color:#678298;padding:13px 10px 7px}.nav{width:100%;display:flex;gap:10px;align-items:center;border:1px solid transparent;background:transparent;color:#9eb4c8;text-align:left;padding:10px 11px;border-radius:9px;margin:2px 0}.nav:hover,.nav.active{background:#10283b;border-color:#21445e;color:#fff}.nav b{font-size:16px;width:21px}.content{padding:23px;max-width:1500px;width:100%;margin:auto}.page-title{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:18px}.page-title h1{margin:0;font-size:27px}.muted{color:var(--muted)}.small{font-size:11px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:linear-gradient(145deg,#0d1e2f,#0a1928);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 10px 30px #0002}.stat small{color:#7792a9}.stat strong{font-size:29px;display:block;margin:8px 0 4px}.delta{font-size:10px;color:var(--green)}.grid2{display:grid;grid-template-columns:1.45fr .85fr;gap:14px;margin-top:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}.panel{background:linear-gradient(145deg,#0d1e2f,#0a1827);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 12px 32px #0002}.ph{padding:14px 16px;border-bottom:1px solid #203c52;display:flex;align-items:center;justify-content:space-between;gap:10px}.ph h3{font-size:14px;margin:0}.body{padding:16px}.tag{font-size:9px;font-weight:900;letter-spacing:.5px;border-radius:999px;padding:4px 7px;background:#173653;color:#a9d7ff}.tag.green{background:#123c30;color:#72e5af}.tag.orange{background:#4a3517;color:#ffd36d}.tag.red{background:#4b202b;color:#ff9baa}.tag.blue{background:#15365a;color:#86c8ff}
/* map */
.map{height:480px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 50%,#123650,#091724 68%)}.map-grid{position:absolute;inset:0;opacity:.18;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:40px 40px}.india-wrap{position:absolute;inset:18px;display:grid;place-items:center}.india-svg{width:min(54%,360px);height:92%;filter:drop-shadow(0 12px 18px #0008)}.india-land{fill:#123c55;stroke:#5a9fbd;stroke-width:1.5}.state-line{fill:none;stroke:#2c617c;stroke-width:1;opacity:.7}.marker{position:absolute;width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 7px #ff5d7340,0 0 22px #ff5d73;cursor:pointer}.marker.green{background:var(--green);box-shadow:0 0 0 7px #48e09b35,0 0 22px #48e09b}.marker.yellow{background:var(--gold);box-shadow:0 0 0 7px #ffc85735,0 0 22px #ffc857}.marker.blue{background:var(--blue);box-shadow:0 0 0 7px #2e9cff35,0 0 22px #2e9cff}.mlabel{position:absolute;font-size:10px;background:#071522dd;border:1px solid #31506b;padding:5px 7px;border-radius:7px;white-space:nowrap;pointer-events:none}.map-tools{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap}.map-legend{position:absolute;left:12px;bottom:12px;background:#071522e8;border:1px solid #31506b;border-radius:8px;padding:8px;font-size:10px}.map-card{position:absolute;right:12px;top:12px;width:190px;background:#071522e8;border:1px solid #31506b;border-radius:10px;padding:11px}.map-card strong{display:block;font-size:13px;margin-bottom:4px}.map-card p{margin:0;color:#91a9bd;font-size:10px;line-height:1.5}
/* feed/table */
.feed{max-height:390px;overflow:auto}.item{padding:13px 15px;border-bottom:1px solid #1b3348;cursor:pointer}.item:hover{background:#10283b}.item:last-child{border-bottom:0}.item b{font-size:12px}.item small{display:block;color:#7892a8;font-size:10px;margin-top:5px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #1c3549;font-size:11px}.row:last-child{border-bottom:0}.value{font-weight:800}.progress{height:8px;background:#172c40;border-radius:99px;overflow:hidden;margin-top:6px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));border-radius:99px}.chart{height:150px;display:flex;align-items:end;gap:9px;padding:18px}.bar{flex:1;background:linear-gradient(#43cde0,#227dcc);border-radius:5px 5px 0 0;min-height:8px}.bar-labels{display:flex;gap:9px;padding:0 18px 12px;color:#6e879b;font-size:9px}.bar-labels span{flex:1;text-align:center}
table{width:100%;border-collapse:collapse;font-size:11px}th,td{text-align:left;padding:11px;border-bottom:1px solid #1b3448;white-space:nowrap}th{color:#6f8aa0;font-size:9px;letter-spacing:.7px}
/* forms */
.form{display:grid;gap:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:10px;color:#8da6ba;font-weight:700}.field input,.field select,.field textarea{width:100%;margin-top:5px;background:#081522;border:1px solid #29465e;color:#edf6ff;border-radius:9px;padding:10px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#48aee5}.field textarea{min-height:100px;resize:vertical}.upload{border:1px dashed #3b617b;border-radius:10px;padding:13px;background:#0a1928}.preview{margin-top:8px;max-width:100%;max-height:190px;border-radius:9px;border:1px solid #29465e}.form-actions{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:10px;border-radius:9px;background:#0d2b3c;border:1px solid #20516a;color:#9fdcff;font-size:10px;line-height:1.5}
/* ai pipeline */
.pipeline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.step{position:relative;padding:13px 10px;border:1px solid #28485f;background:#0b1b2a;border-radius:10px;min-height:95px}.step.done{border-color:#2e765d;background:#0c2a25}.step.active{border-color:#3c9dd1;box-shadow:0 0 0 1px #3c9dd122}.step .num{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#163c56;font-weight:900;font-size:11px}.step h4{margin:9px 0 4px;font-size:11px}.step p{margin:0;color:#7792a8;font-size:9px;line-height:1.4}.connector{position:absolute;right:-9px;top:45px;color:#4c91b6;z-index:2}.score{display:grid;grid-template-columns:110px 1fr;gap:15px;align-items:center}.ring{width:105px;height:105px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) 0 94%,#193246 94%);position:relative}.ring:after{content:"";position:absolute;inset:9px;border-radius:50%;background:#0b1a28}.ring strong{position:relative;z-index:1;font-size:24px}.explain{padding:10px;border-left:3px solid var(--cyan);background:#0b2330;font-size:10px;color:#a7c0d1;line-height:1.55}
/* admin */
.admin-hero{padding:18px;background:linear-gradient(120deg,#102f46,#0d202f);border-bottom:1px solid #24455d}.risk{display:flex;gap:7px;flex-wrap:wrap}.contact{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #1b3448}.contact:last-child{border-bottom:0}.contact b{font-size:11px}.call{font-weight:900;color:#6fe5ad;font-size:12px}.audit{max-height:260px;overflow:auto}.audit div{padding:9px 0;border-bottom:1px solid #1b3448;font-size:10px;color:#8da6ba}.audit b{color:#e8f4ff}
/* modal/toast */
.modal-back{position:fixed;inset:0;background:#020914bb;backdrop-filter:blur(8px);z-index:80;display:grid;place-items:center;padding:18px}.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#0b1a29;border:1px solid #355872;border-radius:17px;box-shadow:var(--shadow)}.toast{position:fixed;right:16px;bottom:16px;z-index:100;max-width:370px;padding:13px 15px;border:1px solid #3d6b88;border-radius:10px;background:#0b2435;color:#eaf7ff;box-shadow:var(--shadow);font-size:11px}.offline{color:var(--orange)!important}.empty{padding:25px;text-align:center;color:#718ba0;font-size:11px}
@media(max-width:1050px){.layout{grid-template-columns:76px 1fr}.side{padding:10px 7px}.nav span,.side .section{display:none}.nav{justify-content:center}.nav b{width:auto}.stats{grid-template-columns:1fr 1fr}.grid2,.grid3{grid-template-columns:1fr}.pipeline{grid-template-columns:1fr 1fr}}
@media(max-width:680px){.hero-card{padding:27px 18px}.home-grid,.form-grid{grid-template-columns:1fr}.top{padding:0 12px}.brand small{display:none}.top-actions .status{display:none}.content{padding:13px}.stats{grid-template-columns:1fr 1fr}.page-title{align-items:flex-start;flex-direction:column}.map{height:420px}.india-svg{width:72%;height:86%}.score{grid-template-columns:1fr}.pipeline{grid-template-columns:1fr}.connector{display:none}.map-card{display:none}}
</style></head>
<body><div id="app"></div><div id="modalRoot"></div>
<script>
const app=document.getElementById('app'), modalRoot=document.getElementById('modalRoot');
const state={role:null,page:'dashboard',selected:null,online:navigator.onLine,reports:JSON.parse(localStorage.getItem('cm_reports')||'null')||[
{id:'R-1042',name:'Aarav',mobile:'••••••4321',loc:'Pune, Maharashtra',event:'Heavy Rain',time:'09:18',desc:'Intense rainfall with water accumulation near the road.',source:'Citizen',status:'Verified',confidence:94,duplicate:false,evidence:'sample',created:'Today'},
{id:'R-1041',name:'Citizen Reporter',mobile:'••••••7782',loc:'Mumbai, Maharashtra',event:'Flood',time:'09:06',desc:'Road flooding reported after continuous rain.',source:'Citizen + Social',status:'Review',confidence:87,duplicate:true,evidence:'sample',created:'Today'},
{id:'R-1040',name:'IMD Feed',mobile:'—',loc:'Delhi, NCR',event:'Heatwave',time:'08:42',desc:'High temperature conditions flagged by official feed.',source:'IMD + Sensor',status:'Verified',confidence:97,duplicate:false,evidence:'sample',created:'Today'},
{id:'R-1039',name:'Citizen Reporter',mobile:'••••••1120',loc:'Guwahati, Assam',event:'Thunderstorm',time:'08:25',desc:'Strong winds and lightning observed.',source:'Citizen',status:'Flagged',confidence:72,duplicate:true,evidence:'sample',created:'Today'}],logs:JSON.parse(localStorage.getItem('cm_logs')||'null')||[]};
function save(){localStorage.setItem('cm_reports',JSON.stringify(state.reports));localStorage.setItem('cm_logs',JSON.stringify(state.logs))}
function log(msg){state.logs.unshift({t:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),m:msg});state.logs=state.logs.slice(0,30);save()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function home(){state.role=null;app.innerHTML=`<main class="home"><div class="hero"><div class="hero-card"><div class="eyebrow">SMART INDIA HACKATHON 2026 • SIH26069 • CODEMATE</div><h1>AI-Powered National Weather Intelligence Platform</h1><p>One intelligent workspace to collect, analyse, correlate, verify and visualise weather reports from official feeds, APIs, websites and citizens.</p><div class="home-grid"><section class="role"><div class="role-icon">👤</div><h2>Citizen / User</h2><p>Check local weather intelligence, explore the India map, receive alerts and submit a photo/video report.</p><button class="btn" onclick="enter('user')">Enter User Dashboard →</button></section><section class="role"><div class="role-icon">🏛️</div><h2>Admin / Government Panel</h2><p>Review evidence, inspect AI signals, cross-check sources, verify events and publish trusted intelligence.</p><button class="btn gold" onclick="enter('admin')">Enter Government Panel →</button></section></div><div class="home-foot"><span class="pill">🌐 Multi-source</span><span class="pill">🤖 AI-assisted</span><span class="pill">🇮🇳 GIS-ready</span><span class="pill">📡 Offline-first demo</span><span class="pill">🔎 Human verification</span></div></div></div></main>`}
function enter(role){state.role=role;state.page='dashboard';render()}
function top(){return `<header class="top"><div class="brand">CODEMATE WEATHER<small>SIH26069 • NATIONAL WEATHER INTELLIGENCE</small></div><div class="top-actions"><span class="status ${state.online?'':'offline'}">● ${state.online?'ONLINE':'OFFLINE MODE'}</span><button class="ghost" onclick="home()">Exit</button></div></header>`}
function nav(){let items=state.role==='user'?[['dashboard','⌂','Dashboard'],['weather','☁','Check Weather'],['map','🇮🇳','India Live Map'],['events','⚠','Disasters & Events'],['report','＋','Report an Event'],['ai','✦','AI Analysis'],['reports','▤','My Reports'],['alerts','🔔','Alerts'],['emergency','☎','Emergency Help'],['analytics','▥','Analytics']]:[['dashboard','⌂','Command Center'],['queue','▤','Verification Queue'],['map','🇮🇳','National GIS Map'],['investigate','⌕','Investigate Report'],['ai','✦','AI Intelligence'],['analytics','▥','Analytics'],['alerts','🔔','Alert Center'],['sources','◎','Source Monitor'],['audit','◷','Audit Trail']];return `<aside class="side"><div class="section">${state.role==='user'?'USER PANEL':'GOVERNMENT PANEL'}</div>${items.map(x=>`<button class="nav ${state.page===x[0]?'active':''}" onclick="go('${x[0]}')"><b>${x[1]}</b><span>${x[2]}</span></button>`).join('')}<div class="section">SYSTEM</div><button class="nav" onclick="toggleOffline()"><b>◉</b><span>${state.online?'Switch to Offline Demo':'Back Online'}</span></button></aside>`}
function shell(content){app.innerHTML=top()+`<div class="layout">${nav()}<main class="content">${content}</main></div>`}
function go(p){state.page=p;render()}
function pageTitle(title,sub,button=''){return `<div class="page-title"><div><h1>${title}</h1><div class="muted small">${sub}</div></div>${button}</div>`}
function stat(n,v,d=''){return `<div class="stat"><small>${n}</small><strong>${v}</strong><span class="delta">${d}</span></div>`}
function indiaMap(){return `<div class="map"><div class="map-grid"></div><div class="india-wrap"><svg class="india-svg" viewBox="0 0 300 480" aria-label="Interactive India map"><path class="india-land" d="M124 8l36 12 13 25 25 19 8 32 31 22-12 29 25 28-14 32 13 35-19 25-4 37-25 25-17 48-24 40-15-36-20-23-11-42-22-24 6-34-24-28 18-27-7-32 22-23 2-35 20-27z"/><path class="state-line" d="M93 91l47 13 34-10m-76 54l62 12 39-16m-84 55l71 9 37-22m-73 69l57 2 33-19m-62 74l42-10 20-24"/></svg></div>
${marker('Pune','Heavy Rain','red','53%','63%')} ${marker('Mumbai','Flood','red','44%','58%')} ${marker('Delhi','Heatwave','yellow','56%','29%')} ${marker('Guwahati','Thunderstorm','blue','68%','34%')} ${marker('Chennai','Rainfall','green','59%','79%')} ${marker('Kolkata','Strong Winds','yellow','64%','55%')}
<div class="map-tools"><button class="ghost" onclick="locateMe()">📍 Use My Location</button><button class="ghost" onclick="toast('Map layers: Weather • Citizen Reports • Alerts')">Layers ▾</button></div><div class="map-card" id="mapInfo"><strong>🇮🇳 National view</strong><p>Tap a weather marker to inspect event intelligence and reports.</p></div><div class="map-legend">🔴 severe &nbsp; 🟡 high &nbsp; 🔵 watch &nbsp; 🟢 monitored</div></div>`}
function marker(city,event,color,left,top){return `<button class="marker ${color}" style="left:${left};top:${top}" onclick="markerInfo('${city}','${event}')" title="${city} • ${event}"></button><span class="mlabel" style="left:calc(${left} + 12px);top:calc(${top} + 12px)">${city}</span>`}
function markerInfo(city,event){document.getElementById('mapInfo').innerHTML=`<strong>${city} • ${event}</strong><p>Open Events or Reports to inspect evidence, AI signals and verification status for this location.</p>`;toast(city+' selected on interactive India map')}
function dashboard(){if(state.role==='user')return userDash();return adminDash()}
function userDash(){let mine=state.reports.filter(r=>r.source==='Citizen');return pageTitle('Welcome, Citizen','Location-aware weather intelligence and community reporting.',`<button class="btn" onclick="go('report')">＋ Report Disaster</button>`)+`<div class="stats">${stat('LOCAL RISK','Moderate','Pune • demo location')} ${stat('ACTIVE EVENTS','12','Across monitored areas')} ${stat('YOUR REPORTS',mine.length,'Stored on this device')} ${stat('VERIFIED EVENTS','86','Platform sample')}</div><div class="grid2"><div class="panel"><div class="ph"><h3>🇮🇳 Interactive National Weather Map</h3><span class="tag green">NEAR-REAL-TIME DEMO</span></div>${indiaMap()}</div><div class="panel"><div class="ph"><h3>📍 My Location Intelligence</h3><span class="tag blue">PUNE</span></div><div class="body"><div class="row"><span>Current area</span><b class="value">Pune, Maharashtra</b></div><div class="row"><span>Dominant event</span><b class="value">Heavy Rain</b></div><div class="row"><span>Event confidence</span><b class="value">94%</b></div><div class="row"><span>Verification</span><span class="tag green">VERIFIED</span></div><div class="row"><span>Safety level</span><b class="value">Moderate</b></div><div class="notice">📌 Location access can be enabled in your browser. This prototype uses a safe demo location when GPS is unavailable.</div><button class="btn" style="width:100%;margin-top:12px" onclick="go('weather')">View Local Weather →</button></div></div></div><div class="grid3"><div class="panel"><div class="ph"><h3>🤖 Latest AI Insight</h3></div><div class="body"><b>Heavy Rain event detected</b><p class="muted small">Multiple sources support the event. One citizen report is linked to the same location.</p><div class="progress"><i style="width:94%"></i></div><div class="small muted" style="margin-top:6px">94% AI confidence • human verification retained</div></div></div><div class="panel"><div class="ph"><h3>🔔 Active Alert</h3></div><div class="body"><span class="tag orange">WEATHER ADVISORY</span><p style="font-size:12px;line-height:1.5">Heavy rainfall reported around Pune. Follow official local advisories and avoid waterlogged roads.</p><button class="ghost" onclick="go('alerts')">Open Alert Center</button></div></div><div class="panel"><div class="ph"><h3>📊 Quick Analytics</h3></div><div class="body"><div class="row"><span>Rainfall reports</span><b>48</b></div><div class="row"><span>Flood reports</span><b>19</b></div><div class="row"><span>Heatwave reports</span><b>13</b></div><button class="ghost" onclick="go('analytics')">Explore Analytics</button></div></div></div>`}
function adminDash(){let review=state.reports.filter(r=>r.status!=='Verified').length;return pageTitle('National Weather Command Center','Government/admin view • review evidence before publishing trusted events.',`<button class="btn gold" onclick="go('queue')">Open Verification Queue →</button>`)+`<div class="stats">${stat('REPORTS INGESTED','12,486','Multi-source demo stream')} ${stat('AI EVENTS DETECTED','327','Across monitored locations')} ${stat('AWAITING REVIEW',review,'Requires human decision')} ${stat('HIGH-RISK ALERTS','18','Priority queue')}</div><div class="grid2"><div class="panel"><div class="ph"><h3>🇮🇳 National GIS Situation View</h3><span class="tag red">18 HIGH RISK</span></div>${indiaMap()}</div><div class="panel"><div class="ph"><h3>🚨 Priority Verification Queue</h3><span class="tag">${review} ITEMS</span></div><div class="feed">${state.reports.slice(0,6).map(reportItem).join('')}</div></div></div><div class="grid3"><div class="panel"><div class="ph"><h3>🧠 AI Services</h3></div><div class="body">${service('Source correlation','Active','92%')} ${service('Duplicate detection','Active','89%')} ${service('Suspicious-content flagging','Active','76%')} ${service('Human verification','Required','—')}</div></div><div class="panel"><div class="ph"><h3>📡 Source Health</h3></div><div class="body">${source('IMD / Official','Connected')} ${source('Public APIs','Connected')} ${source('Citizen reports','Receiving')} ${source('Social feeds','Demo stream')}</div></div><div class="panel"><div class="ph"><h3>⚡ Response Controls</h3></div><div class="body"><button class="btn" style="width:100%;margin-bottom:8px" onclick="go('alerts')">Create Alert</button><button class="ghost" style="width:100%" onclick="toast('Dashboard refresh simulated successfully')">Refresh Intelligence</button></div></div></div>`}
function reportItem(r,i){return `<div class="item" onclick="inspectReport('${r.id}')"><b>${esc(r.loc)} — ${esc(r.event)}</b> <span class="tag ${r.status==='Verified'?'green':r.status==='Flagged'?'red':'orange'}">${r.status}</span><small>${esc(r.source)} • ${esc(r.time)} • AI ${r.confidence}%${r.duplicate?' • possible duplicate':''}</small></div>`}
function service(a,b,c){return `<div class="row"><span>${a}</span><span><b>${b}</b> ${c!=='—'?'<span class="muted">• '+c+'</span>':''}</span></div>`}
function source(a,b){return `<div class="row"><span>${a}</span><span class="tag green">● ${b}</span></div>`}
function weather(){return pageTitle('Check Weather','Understand your local conditions at a glance.',`<button class="ghost" onclick="locateMe()">📍 Detect Location</button>`)+`<div class="grid2"><div class="panel"><div class="ph"><h3>🌧️ Pune Local Snapshot</h3><span class="tag green">DEMO DATA</span></div><div class="body" style="display:grid;grid-template-columns:1fr 1fr;gap:15px"><div><div style="font-size:50px">🌧️</div><b style="font-size:28px">26°C</b><p class="muted small">Heavy rain conditions</p></div><div>${service('Humidity','84%','High')} ${service('Wind','18 km/h','SW')} ${service('Visibility','4.2 km','Reduced')} ${service('Risk','Moderate','Monitor')}</div></div></div><div class="panel"><div class="ph"><h3>🕐 Next Hours</h3></div><div class="body">${['Now','+1h','+2h','+3h'].map((x,i)=>`<div class="row"><span>${x}</span><b>${i<2?'🌧️ Rain':'☁️ Cloudy'} • ${26-i}°C</b></div>`).join('')}<div class="notice" style="margin-top:10px">Weather values in this prototype are demonstration data unless connected to a live weather API.</div></div></div></div><div class="panel" style="margin-top:14px"><div class="ph"><h3>Weather Understanding</h3></div><div class="body"><div class="pipeline">${simpleStep('01','Observe','Local weather inputs')} ${simpleStep('02','Analyse','AI-assisted signals')} ${simpleStep('03','Verify','Cross-source evidence')} ${simpleStep('04','Act','Alerts & decisions')}</div></div></div>`}
function simpleStep(n,t,p){return `<div class="step"><div class="num">${n}</div><h4>${t}</h4><p>${p}</p></div>`}
function mapPage(){return pageTitle('Interactive India Map','Explore weather events by location. Tap markers for details.')+`<div class="panel">${indiaMap()}</div>`}
function events(){return pageTitle('Disasters & Weather Events','Filterable event intelligence from monitored sources.',`<select class="ghost" onchange="filterEvents(this.value)"><option>All events</option><option>Heavy Rain</option><option>Flood</option><option>Heatwave</option><option>Thunderstorm</option></select>`)+`<div class="grid3">${['Heavy Rain','Flood','Heatwave','Thunderstorm','Fog','Strong Winds'].map((e,i)=>`<div class="panel event-card"><div class="ph"><h3>${['🌧️','🌊','🔥','⛈️','🌫️','💨'][i]} ${e}</h3><span class="tag ${i<2?'red':i<4?'orange':'blue'}">${[48,19,13,11,8,7][i]} REPORTS</span></div><div class="body"><div class="row"><span>Highest activity</span><b>${['Pune','Mumbai','Delhi','Guwahati','Lucknow','Kolkata'][i]}</b></div><div class="row"><span>Avg. confidence</span><b>${[94,87,97,82,79,85][i]}%</b></div><button class="ghost" onclick="toast('${e} selected — opening location intelligence')">Explore Event →</button></div></div>`).join('')}</div>`}
function reportPage(){return pageTitle('Report a Weather Event','Citizen evidence helps the platform build a wider situational picture.')+`<div class="grid2"><div class="panel"><div class="ph"><h3>📝 Citizen Report Form</h3><span class="tag blue">AI INTAKE</span></div><div class="body"><form class="form" onsubmit="submitReport(event)"><div class="form-grid"><div class="field"><label>PERSON NAME<input id="rname" required placeholder="Your name"></label></div><div class="field"><label>MOBILE NUMBER<input id="rmobile" required inputmode="numeric" pattern="[0-9]{10}" placeholder="10-digit mobile number"></label></div></div><div class="form-grid"><div class="field"><label>LOCATION<input id="rloc" value="Pune, Maharashtra" required></label></div><div class="field"><label>EVENT TIME<input id="rtime" type="datetime-local" required></label></div></div><div class="field"><label>WEATHER / DISASTER TYPE<select id="revent"><option>Heavy Rain</option><option>Rainfall</option><option>Flood</option><option>Thunderstorm</option><option>Heatwave</option><option>Fog</option><option>Dust Storm</option><option>Strong Winds</option></select></label></div><div class="field"><label>DESCRIPTION<textarea id="rdesc" required placeholder="What did you observe? Mention road flooding, wind, rainfall, visibility, etc."></textarea></label></div><div class="upload"><div class="field"><label>PHOTO / VIDEO EVIDENCE<input id="rfile" type="file" accept="image/*,video/*" onchange="previewFile(this)"></label></div><div id="preview"></div></div><div class="notice">🔐 For this demo, the report stays in this browser session/local storage. Mobile number is masked after submission. AI flags are signals; an admin makes the final verification decision.</div><div class="form-actions"><button class="btn">🚀 Submit for AI Analysis</button><button type="button" class="ghost" onclick="go('dashboard')">Cancel</button></div></form></div></div><div class="panel"><div class="ph"><h3>🤖 What happens next?</h3></div><div class="body"><div class="pipeline">${simpleStep('01','Receive','Report + evidence')} ${simpleStep('02','Clean','Normalize details')} ${simpleStep('03','Detect','Classify event')} ${simpleStep('04','Check','Duplicate search')} ${simpleStep('05','Correlate','Compare sources')} ${simpleStep('06','Flag','Suspicious signals')} ${simpleStep('07','Review','Admin verification')} ${simpleStep('08','Publish','Trusted event')}</div></div></div></div>`}
let currentFile=null;function previewFile(input){currentFile=input.files[0]||null;let p=document.getElementById('preview');if(!currentFile){p.innerHTML='';return}if(currentFile.type.startsWith('image/'))p.innerHTML=`<img class="preview" src="${URL.createObjectURL(currentFile)}">`;else if(currentFile.type.startsWith('video/'))p.innerHTML=`<video class="preview" controls src="${URL.createObjectURL(currentFile)}"></video>`;else p.innerHTML=''}
function submitReport(e){e.preventDefault();let id='R-'+(1043+state.reports.length),dt=new Date(document.getElementById('rtime').value);let loc=document.getElementById('rloc').value.trim(),event=document.getElementById('revent').value,dup=state.reports.some(r=>r.loc.toLowerCase().includes(loc.split(',')[0].toLowerCase())&&r.event===event);let r={id,name:document.getElementById('rname').value.trim(),mobile:document.getElementById('rmobile').value.slice(-4),loc,event,time:isNaN(dt)?new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):dt.toLocaleString(),desc:document.getElementById('rdesc').value.trim(),source:'Citizen',status:'Review',confidence:dup?79:91,duplicate:dup,evidence:currentFile?{name:currentFile.name,type:currentFile.type,size:currentFile.size,url:URL.createObjectURL(currentFile)}:'none',created:'Just now'};state.reports.unshift(r);log('New citizen report '+id+' received from '+loc);save();currentFile=null;toast('Report '+id+' received. AI analysis started → Admin verification queue.');setTimeout(()=>go('ai'),350)}
function reportsPage(){return pageTitle('My Reports','Track what you submitted and its verification status.')+`<div class="panel"><div class="ph"><h3>Citizen Submission History</h3><span class="tag">LOCAL RECORD</span></div><div class="feed">${state.reports.filter(r=>r.source==='Citizen').map(reportItem).join('')||'<div class="empty">No citizen reports yet.</div>'}</div></div>`}
function aiPage(){let r=state.reports[0]||state.reports[0];return pageTitle('AI Analysis','A transparent, step-by-step view of how a report is processed.',`<button class="ghost" onclick="runAI()">▶ Run Demo Analysis</button>`)+`<div class="panel"><div class="ph"><h3>Processing Pipeline • ${esc(r?.id||'R-1042')}</h3><span class="tag blue">AI-ASSISTED</span></div><div class="body"><div class="pipeline">${['Report Received','Data Cleaned','Event Classified','Duplicate Check','Cross-Source Correlation','Suspicious Signal Check','Confidence Assessment','Human Verification'].map((x,i)=>`<div class="step ${i<6?'done':''}" id="aist${i}"><div class="num">${i<6?'✓':i+1}</div><h4>${x}</h4><p>${['Citizen details and evidence received','Normalize time, location and text','Rainfall / flood / heatwave etc.','Find related or repeated reports','Compare official/API/social/citizen signals','Flag unusual or potentially misleading content','Combine evidence into an assistance score','Admin makes the final decision'][i]}</p><span class="connector">›</span></div>`).join('')}</div></div></div><div class="grid2"><div class="panel"><div class="ph"><h3>Confidence & Explanation</h3></div><div class="body"><div class="score"><div class="ring"><strong>${r?.confidence||94}%</strong></div><div><b>AI confidence signal</b><p class="muted small">The score is an aid for prioritisation, not proof that a report is true.</p><div class="explain">Why this score? Event type, time/location consistency, duplicate similarity and supporting sources contribute to the signal. Final verification stays with a human administrator.</div></div></div></div></div><div class="panel"><div class="ph"><h3>🔎 Evidence Signals</h3></div><div class="body">${service('Event classification',r?.event||'Heavy Rain','Matched')} ${service('Duplicate similarity',r?.duplicate?'Potential match':'Low','Review')} ${service('Cross-source support',r?.source?.includes('+')?'Multiple':'Awaiting','Correlate')} ${service('Human verification','Required','Admin')}</div></div></div>`}
function runAI(){let ids=[0,1,2,3,4,5,6,7];ids.forEach((i)=>{setTimeout(()=>{document.querySelectorAll('.step')[i]?.classList.add('active','done');toast('AI step '+(i+1)+' completed');},i*500)});}
function queue(){return pageTitle('Verification Queue','Prioritise reports requiring human review.','')+`<div class="panel"><div class="ph"><h3>Incoming Reports</h3><span class="tag orange">HUMAN-IN-THE-LOOP</span></div><div style="overflow:auto"><table><thead><tr><th>ID</th><th>LOCATION</th><th>EVENT</th><th>SOURCE</th><th>AI</th><th>DUPLICATE</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody>${state.reports.map((r,i)=>`<tr><td>${r.id}</td><td>${esc(r.loc)}</td><td>${esc(r.event)}</td><td>${esc(r.source)}</td><td>${r.confidence}%</td><td>${r.duplicate?'⚠ Potential':'—'}</td><td><span class="tag ${r.status==='Verified'?'green':r.status==='Flagged'?'red':'orange'}">${r.status}</span></td><td><button class="ghost" onclick="inspectReport('${r.id}')">Review</button></td></tr>`).join('')}</tbody></table></div></div>`}
function inspectReport(id){let r=state.reports.find(x=>x.id===id);if(!r)return;modalRoot.innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="ph"><h3>🔎 Investigate ${esc(r.id)}</h3><button class="ghost" onclick="closeModal()">✕</button></div><div class="body"><div class="grid2" style="margin:0"><div><div class="row"><span>Reporter</span><b>${esc(r.name)} • ••••••${esc(r.mobile)}</b></div><div class="row"><span>Location</span><b>${esc(r.loc)}</b></div><div class="row"><span>Event time</span><b>${esc(r.time)}</b></div><div class="row"><span>Event</span><b>${esc(r.event)}</b></div><div class="row"><span>Description</span><b style="max-width:230px;text-align:right">${esc(r.desc)}</b></div><div class="row"><span>AI confidence</span><b>${r.confidence}%</b></div><div class="row"><span>Duplicate check</span><span class="tag ${r.duplicate?'orange':'green'}">${r.duplicate?'POTENTIAL MATCH':'NO STRONG MATCH'}</span></div></div><div>${r.evidence&&r.evidence!=='sample'&&r.evidence.url?(r.evidence.type.startsWith('image/')?`<img class="preview" src="${r.evidence.url}">`:`<video class="preview" controls src="${r.evidence.url}"></video>`):`<div class="notice">🎞️ Demo evidence placeholder<br><br>This sample report represents an incoming image/video report. A real citizen upload appears here after submission.</div>`}<div class="notice" style="margin-top:10px">Cross-source check: ${r.source.includes('+')?'supporting signals found from more than one source':'awaiting additional corroboration'}.</div></div></div><hr style="border:0;border-top:1px solid #203c52;margin:16px 0"><b>Admin decision</b><p class="muted small">Use evidence + source correlation + AI signals. AI does not make the final decision.</p><div class="form-actions"><button class="btn" onclick="decision('${r.id}','Verified')">✓ Verify & Publish</button><button class="btn gold" onclick="decision('${r.id}','Review')">↺ Keep Under Review</button><button class="btn red" onclick="decision('${r.id}','Flagged')">⚑ Flag Report</button></div></div></div></div>`}
function decision(id,status){let r=state.reports.find(x=>x.id===id);if(!r)return;r.status=status;log('Admin marked '+id+' as '+status);save();closeModal();toast(id+' updated to '+status+(status==='Verified'?' and published to user intelligence.':'.'));render()}
function investigate(){let r=state.reports[0];return pageTitle('Report Investigation','Inspect the complete evidence chain for a selected citizen report.')+`<div class="grid2"><div class="panel"><div class="ph"><h3>Selected Report</h3><span class="tag orange">REVIEW</span></div><div class="body"><div class="row"><span>ID</span><b>${r.id}</b></div><div class="row"><span>Location</span><b>${esc(r.loc)}</b></div><div class="row"><span>Event</span><b>${esc(r.event)}</b></div><div class="row"><span>Source</span><b>${esc(r.source)}</b></div><button class="btn" onclick="inspectReport('${r.id}')">Open Full Evidence →</button></div></div><div class="panel"><div class="ph"><h3>Cross-Source Correlation</h3></div><div class="body">${source('Official feed','Matched')} ${source('Public API','Matched')} ${source('Citizen report','Matched')} ${source('Social content','Related')}<div class="notice" style="margin-top:12px">Correlation increases confidence but does not prove authenticity by itself.</div></div></div></div>`}
function analytics(){return pageTitle('Analytics & Trends','Location, event and source patterns for decision support.')+`<div class="grid3"><div class="panel"><div class="ph"><h3>Events by Category</h3></div><div class="chart">${[72,44,38,31,24,18].map(x=>`<div class="bar" style="height:${x}%"></div>`).join('')}</div><div class="bar-labels">${['Rain','Flood','Heat','Storm','Fog','Wind'].map(x=>`<span>${x}</span>`).join('')}</div></div><div class="panel"><div class="ph"><h3>Reports by Source</h3></div><div class="body">${[['IMD / official',48],['Citizen',31],['APIs',14],['Social',7]].map(x=>`<div style="margin:13px 0"><div class="row" style="padding:0;border:0"><span>${x[0]}</span><b>${x[1]}%</b></div><div class="progress"><i style="width:${x[1]}%"></i></div></div>`).join('')}</div></div><div class="panel"><div class="ph"><h3>Verification Outcomes</h3></div><div class="body">${service('Verified','86','events')} ${service('Under review','18','events')} ${service('Flagged','9','events')} ${service('Duplicates grouped','27','reports')}</div></div></div><div class="panel" style="margin-top:14px"><div class="ph"><h3>Decision Support Insight</h3></div><div class="body"><div class="notice">Rain and flood reports are clustering around a small number of locations in this demonstration dataset. In a production deployment, these signals can support situational awareness and resource planning.</div></div></div>`}
function alerts(){return pageTitle(state.role==='admin'?'Alert Center':'My Alerts','Weather advisories and verified event notifications.')+`<div class="grid2"><div class="panel"><div class="ph"><h3>🚨 Active Alerts</h3><span class="tag red">PRIORITY</span></div><div class="body">${['Heavy rainfall • Pune','Flood risk • Mumbai','Heatwave • Delhi'].map((x,i)=>`<div class="item"><b>${x}</b><small>${i===0?'Verified event • monitor waterlogged roads':'Advisory • follow local official guidance'}</small></div>`).join('')}</div></div><div class="panel"><div class="ph"><h3>${state.role==='admin'?'Create Alert':'Alert Flow'}</h3></div><div class="body">${state.role==='admin'?`<div class="form"><div class="field"><label>ALERT TITLE<input id="atitle" placeholder="Severe weather alert"></label></div><div class="field"><label>MESSAGE<textarea id="amsg" placeholder="Enter verified alert message"></textarea></label></div><button class="btn" onclick="createAlert()">📢 Publish Demo Alert</button></div>`:`<div class="pipeline">${simpleStep('01','Detect','Event signal')} ${simpleStep('02','Verify','Admin review')} ${simpleStep('03','Alert','User notification')} ${simpleStep('04','Act','Safety guidance')}</div>`}</div></div></div>`}
function createAlert(){toast('Demo alert published to the User alert center.');log('Admin published a demo alert');}
function emergency(){return pageTitle('Emergency Assistance','Quick access to emergency services. Verify local contacts before relying on them in a real emergency.')+`<div class="grid2"><div class="panel"><div class="ph"><h3>📞 India Emergency Contacts</h3><span class="tag red">QUICK HELP</span></div><div class="body">${[['🚨 Integrated Emergency','112'],['🚑 Ambulance','108'],['🚒 Fire & Rescue','101'],['🚓 Police','100']].map(x=>`<div class="contact"><div><b>${x[0]}</b><div class="muted small">National emergency number</div></div><a class="call" href="tel:${x[1]}">${x[1]} ☎</a></div>`).join('')}<div class="notice" style="margin-top:12px">For a production system, this panel should use verified location-specific emergency directories rather than invented local contacts.</div></div></div><div class="panel"><div class="ph"><h3>📍 Location Assistance</h3></div><div class="body"><b>Pune, Maharashtra</b><p class="muted small">Prototype can attach the user's location to a report and display relevant emergency guidance.</p><button class="btn" onclick="locateMe()">Detect My Location</button><div class="notice" style="margin-top:12px">Offline demo: previously loaded emergency information remains visible when connectivity is unavailable.</div></div></div></div>`}
function sources(){return pageTitle('Source Monitor','Observe the health of the multi-source ingestion layer.')+`<div class="grid3">${['IMD / Official Feeds','Public APIs','Citizen Reports','Web Sources','Social Media Stream','Open Datasets'].map((x,i)=>`<div class="panel"><div class="ph"><h3>${x}</h3><span class="tag green">CONNECTED</span></div><div class="body">${service('Ingestion','Active','low latency')} ${service('Data quality',i===4?'Needs review':'Healthy',i===4?'watch':'stable')} ${service('Last signal','Just now','demo')}</div></div>`).join('')}</div>`}
function audit(){return pageTitle('Audit Trail','Transparent record of prototype actions and admin decisions.')+`<div class="panel"><div class="ph"><h3>Activity Log</h3><span class="tag">LOCAL DEMO</span></div><div class="body audit">${state.logs.length?state.logs.map(l=>`<div><b>${l.t}</b> • ${esc(l.m)}</div>`).join(''):'<div>No actions yet.</div>'}</div></div>`}
function userAnalytics(){return analytics()}
function userAlerts(){return alerts()}
function toggleOffline(){state.online=!state.online;toast(state.online?'Back online — live connectivity indicator restored.':'Offline demo enabled — cached prototype data remains available.');render()}
function locateMe(){if(!navigator.geolocation){toast('Location is not available in this browser.');return}navigator.geolocation.getCurrentPosition(p=>toast('Location detected: '+p.coords.latitude.toFixed(3)+', '+p.coords.longitude.toFixed(3)+' (demo display)'),()=>toast('Location permission unavailable — using Pune demo location.'))}
function filterEvents(v){toast(v==='All events'?'Showing all monitored events':v+' filter applied')}
function closeModal(){modalRoot.innerHTML=''}
function toast(m){let d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}
function render(){if(!state.role){home();return}let content='';if(state.page==='dashboard')content=dashboard();else if(state.page==='weather')content=weather();else if(state.page==='map')content=mapPage();else if(state.page==='events')content=events();else if(state.page==='report')content=reportPage();else if(state.page==='ai')content=aiPage();else if(state.page==='reports')content=reportsPage();else if(state.page==='alerts')content=alerts();else if(state.page==='emergency')content=emergency();else if(state.page==='analytics')content=analytics();else if(state.page==='queue')content=queue();else if(state.page==='investigate')content=investigate();else if(state.page==='sources')content=sources();else if(state.page==='audit')content=audit();shell(content)}
window.addEventListener('online',()=>{state.online=true;render()});window.addEventListener('offline',()=>{state.online=false;render()});
// set default report time
render();setTimeout(()=>{let x=document.getElementById('rtime');if(x&&!x.value){let d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());x.value=d.toISOString().slice(0,16)}},50);
</script></body></html>
