<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CODEMATE Weather Intelligence</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#edf5ff}button,input,select,textarea{font:inherit}button{cursor:pointer}.home{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:25px;background:radial-gradient(circle at 20% 20%,#123d65,#07111f 50%)}.box{max-width:900px;text-align:center}.brand{color:#6bb7ff;font-weight:bold;letter-spacing:2px;font-size:13px}.home h1{font-size:clamp(32px,6vw,58px);margin:15px 0 10px}.home p{color:#a9bbcf;line-height:1.6}.roles{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px}.role,.panel,.stat{background:#0c1a2a;border:1px solid #203b55;border-radius:16px}.role{text-align:left;padding:25px}.role h2{margin:12px 0 7px}.role p{font-size:13px;margin-bottom:20px}.btn{border:0;background:#198cff;color:white;padding:11px 16px;border-radius:9px;font-weight:bold}.ghost{border:1px solid #31506d;background:#0c1a2a;color:white;padding:9px 13px;border-radius:8px}.top{height:65px;background:#0a1726;border-bottom:1px solid #20354c;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:10}.logo{font-weight:900}.logo small{display:block;color:#708da9;font-size:9px;letter-spacing:1.4px}.live{color:#64e9a1;font-size:12px;font-weight:bold}.page{max-width:1450px;margin:auto;padding:20px}.head{margin-bottom:15px}.head h1{margin:0 0 5px}.muted{color:#8fa5bd}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:15px}.stat small{color:#8da4bb}.stat strong{display:block;font-size:27px;margin-top:7px}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:15px;margin-top:15px}.panel{overflow:hidden}.ph{padding:14px 16px;border-bottom:1px solid #20354c;display:flex;justify-content:space-between;align-items:center}.ph h3{margin:0;font-size:15px}.map{height:550px;background:radial-gradient(circle,#12324a,#081522 68%);position:relative;overflow:hidden}.india{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:330px;height:465px;background:#16364d;clip-path:polygon(45% 0,59% 7%,65% 17%,78% 28%,72% 38%,88% 49%,78% 59%,68% 63%,62% 76%,56% 92%,50% 100%,44% 89%,38% 76%,31% 65%,23% 57%,28% 46%,17% 38%,25% 28%,30% 17%,39% 11%);border:2px solid #315a76}.pin{position:absolute;width:17px;height:17px;border-radius:50%;background:#ff566c;border:3px solid white;box-shadow:0 0 0 7px #ff566c33}.pin.green{background:#55e39b;box-shadow:0 0 0 7px #55e39b33}.pin.yellow{background:#ffb43b;box-shadow:0 0 0 7px #ffb43b33}.lab{position:absolute;background:#071522dd;border:1px solid #34516a;border-radius:7px;padding:5px 7px;font-size:10px;white-space:nowrap}.legend{position:absolute;left:12px;bottom:12px;background:#071522e8;border:1px solid #31506b;padding:9px;border-radius:8px;font-size:10px}.feed{max-height:550px;overflow:auto}.item{padding:13px 15px;border-bottom:1px solid #1b3045;cursor:pointer}.item:hover{background:#102438}.item b{font-size:13px}.item small{display:block;color:#829bb4;margin-top:5px}.tag{display:inline-block;font-size:10px;padding:3px 6px;border-radius:5px;background:#173653;color:#9dd0ff;margin-left:5px}.Verified{background:#123d30;color:#6fe3ac}.Review{background:#493915;color:#ffd06e}.Flagged{background:#4b202b;color:#ff9aaa}.form{padding:17px;display:grid;gap:11px}.form label{font-size:12px;color:#94aac1}.form input,.form select,.form textarea{width:100%;margin-top:5px;background:#081522;border:1px solid #2b4862;color:white;padding:10px;border-radius:8px}.form textarea{min-height:110px}.ai{padding:16px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #20364c;font-size:12px}.meter{height:8px;background:#162b40;border-radius:8px;overflow:hidden;margin-top:8px}.meter span{display:block;height:100%;background:#55e39b}.chart{height:140px;display:flex;align-items:end;gap:8px;padding:20px}.bar{flex:1;background:#2389d9;border-radius:5px 5px 0 0}.toast{position:fixed;right:15px;bottom:15px;z-index:30;background:#102a42;border:1px solid #3b6688;padding:14px;border-radius:10px;max-width:360px;box-shadow:0 10px 30px #0008}.actions{display:flex;gap:8px;margin-top:12px}.ok{background:#123d30;color:#70e4ad;border:1px solid #28694f;padding:9px 12px;border-radius:8px}.flag{background:#4b202b;color:#ff9aaa;border:1px solid #713344;padding:9px 12px;border-radius:8px}
@media(max-width:800px){.roles,.grid,.stats{grid-template-columns:1fr}.page{padding:12px}.map{height:450px}.india{width:245px;height:365px}.top{padding:0 12px}.live{display:none}}
</style></head><body><div id="app"></div>
<script>
let reports=[
{id:1,loc:"Pune",ev:"Heavy Rain",src:"IMD + Citizen + API",c:94,s:"Verified",t:"17:32"},
{id:2,loc:"Mumbai",ev:"Flood",src:"Citizen + Social",c:87,s:"Review",t:"17:28"},
{id:3,loc:"Delhi",ev:"Heatwave",src:"IMD + Sensor",c:97,s:"Verified",t:"17:21"},
{id:4,loc:"Goa",ev:"Rainfall",src:"API + Citizen",c:82,s:"Flagged",t:"17:18"}];
const app=document.getElementById("app");
function home(){app.innerHTML=`<main class="home"><div class="box"><div class="brand">SMART INDIA HACKATHON 2026 • SIH26069 • CODEMATE</div><h1>AI-Powered National Weather Intelligence Platform</h1><p>Collect • Analyse • Verify • Visualise weather information from official sources, APIs and citizen reports.</p><div class="roles"><section class="role"><div style="font-size:40px">👤</div><h2>User</h2><p>Submit a real weather observation with location, event details and optional evidence.</p><button class="btn" onclick="user()">Continue as User →</button></section><section class="role"><div style="font-size:40px">🛡️</div><h2>Admin</h2><p>Review incoming reports, inspect AI analysis and verify weather events.</p><button class="btn" onclick="admin()">Continue as Admin →</button></section></div></div></main>`}
function top(title,sub){return `<div class="top"><div class="logo">CODEMATE WEATHER<small>SIH26069 • NATIONAL WEATHER INTELLIGENCE</small></div><div><span class="live">● LIVE STREAM</span> <button class="ghost" onclick="home()">Home</button></div></div><div class="page"><div class="head"><h1>${title}</h1><div class="muted">${sub}</div></div>`}
function user(){app.innerHTML=top("Citizen Weather Reporting","Submit a report. The prototype processes it and sends it to Admin verification.")+`<div class="grid"><div class="panel"><div class="ph"><h3>📍 Submit Weather Report</h3><span class="tag">LIVE INTAKE</span></div><form class="form" onsubmit="submitReport(event)"><label>Name (optional)<input id="name" placeholder="Citizen / Reporter"></label><label>Location<input id="loc" value="Pune" required></label><label>Weather event<select id="ev"><option>Heavy Rain</option><option>Rainfall</option><option>Flood</option><option>Thunderstorm</option><option>Heatwave</option><option>Fog</option><option>Dust Storm</option><option>Strong Winds</option></select></label><label>Description<textarea id="desc" required placeholder="Describe what you observed..."></textarea></label><label>Photo / video evidence<input id="file" type="file" accept="image/*,video/*"></label><div class="muted" style="font-size:11px">📡 Timestamp is generated automatically. GPS can be attached when browser permission is available.</div><button class="btn">🚀 Submit Report for AI Analysis</button></form></div><div class="panel"><div class="ph"><h3>🤖 AI Analysis Engine</h3><span class="tag Verified">ASSISTED</span></div><div class="ai"><div class="row"><span>Multilingual NLP</span><b>Ready</b></div><div class="row"><span>Event classification</span><b>Ready</b></div><div class="row"><span>Duplicate detection</span><b>Ready</b></div><div class="row"><span>Cross-source correlation</span><b>Ready</b></div><div class="row"><span>Human verification</span><b>Required</b></div><p class="muted" style="font-size:11px;line-height:1.6">AI produces a confidence score and flags suspicious/duplicate reports. It does not make the final verification decision.</p></div></div></div><div class="panel" style="margin-top:15px"><div class="ph"><h3>Recent Platform Reports</h3></div><div class="feed">${feed()}</div></div></div>`}
function submitReport(e){e.preventDefault();let loc=document.getElementById("loc").value.trim(),ev=document.getElementById("ev").value,desc=document.getElementById("desc").value;let dup=reports.some(r=>r.loc.toLowerCase()==loc.toLowerCase()&&r.ev==ev);let c=(82+Math.floor(Math.random()*15))-(dup?8:0);let now=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});reports.unshift({id:Date.now(),loc,ev,src:"Citizen Report",c,s:"Review",t:now});toast("Report received • AI confidence "+c+"% • "+(dup?"Possible duplicate flagged":"No immediate duplicate found"));setTimeout(user,500)}
function feed(){return reports.map(r=>`<div class="item"><b>${r.loc} — ${r.ev}</b><span class="tag ${r.s}">${r.s}</span><small>${r.src} • ${r.t} • AI confidence ${r.c}%</small></div>`).join("")}
function admin(){app.innerHTML=top("Admin Verification & Weather Intelligence","Review reports, inspect AI analysis and publish verified events to the map.")+`<div class="stats"><div class="stat"><small>REPORTS RECEIVED</small><strong>${12486+reports.length}</strong></div><div class="stat"><small>EVENTS DETECTED</small><strong>327</strong></div><div class="stat"><small>HIGH-RISK ALERTS</small><strong>18</strong></div><div class="stat"><small>AVG CONFIDENCE</small><strong>91%</strong></div></div><div class="grid"><div class="panel"><div class="ph"><h3>🇮🇳 Real-time GIS Event View</h3><select class="ghost" onchange="mapFilter(this.value)"><option>All Events</option><option>Heavy Rain</option><option>Flood</option><option>Heatwave</option><option>Rainfall</option></select></div><div class="map"><div class="india"></div><div class="pin" data-e="Heavy Rain" style="left:52%;top:62%"></div><div class="lab" style="left:52%;top:62%">Pune • Heavy Rain</div><div class="pin" data-e="Flood" style="left:43%;top:54%"></div><div class="lab" style="left:43%;top:54%">Mumbai • Flood</div><div class="pin yellow" data-e="Heatwave" style="left:53%;top:29%"></div><div class="lab" style="left:53%;top:29%">Delhi • Heatwave</div><div class="pin green" data-e="Rainfall" style="left:61%;top:70%"></div><div class="lab" style="left:61%;top:70%">Goa • Rainfall</div><div class="legend">🔴 critical &nbsp; 🟡 high risk &nbsp; 🟢 monitored</div></div><div class="ph"><h3>Pipeline</h3><span class="muted" style="font-size:10px">COLLECT → CLEAN → UNDERSTAND → DETECT → VERIFY → DECIDE</span></div></div><div class="panel"><div class="ph"><h3>📥 Incoming Reports</h3><span class="tag">ADMIN</span></div><div class="feed">${reports.map((r,i)=>`<div class="item" onclick="inspect(${i})"><b>${r.loc} — ${r.ev}</b><span class="tag ${r.s}">${r.s}</span><small>${r.src} • ${r.t} • ${r.c}% confidence</small></div>`).join("")}</div></div></div><div class="grid"><div class="panel"><div class="ph"><h3>📊 Event Analytics</h3><span class="muted">Demo live metrics</span></div><div class="chart">${[35,52,44,75,58,90,68,96].map(x=>`<div class="bar" style="height:${x}%"></div>`).join("")}</div></div><div class="panel"><div class="ph"><h3>🧠 Intelligence Services</h3></div><div class="ai"><div class="row"><span>Source fusion</span><b>Active</b></div><div class="row"><span>Duplicate detection</span><b>Active</b></div><div class="row"><span>Trust scoring</span><b>Active</b></div><div class="row"><span>Human verification</span><b>Active</b></div></div></div></div><div class="panel" style="margin-top:15px"><div class="ph"><h3>Event Intelligence Table</h3></div><div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:12px"><tr style="color:#8199b1"><th>TIME</th><th>LOCATION</th><th>EVENT</th><th>SOURCES</th><th>CONFIDENCE</th><th>STATUS</th></tr>${reports.map(r=>`<tr><td>${r.t}</td><td>${r.loc}</td><td>${r.ev}</td><td>${r.src}</td><td>${r.c}%</td><td><span class="tag ${r.s}">${r.s}</span></td></tr>`).join("")}</table></div></div></div>`}
function inspect(i){let r=reports[i];let x=document.createElement("div");x.className="toast";x.id="inspect";x.innerHTML=`<b>🤖 AI Analysis — ${r.loc}</b><div style="font-size:12px;line-height:1.8;margin-top:7px">Detected event: <b>${r.ev}</b><br>Source: ${r.src}<br>Duplicate risk: <b>${r.s==="Review"?"Check required":"Low"}</b><br>Cross-source match: <b>${r.src.includes("+")?"Matched":"Awaiting corroboration"}</b><br>AI confidence: <b>${r.c}%</b><div class="meter"><span style="width:${r.c}%"></span></div><div class="actions"><button class="ok" onclick="verify(${i})">✓ Verify</button><button class="flag" onclick="flag(${i})">⚑ Flag</button></div></div>`;document.body.appendChild(x)}
function verify(i){reports[i].s="Verified";close();toast("Report verified and published to the intelligence dashboard.");admin()}
function flag(i){reports[i].s="Flagged";close();toast("Report flagged for further review.");admin()}
function close(){let x=document.getElementById("inspect");if(x)x.remove()}
function mapFilter(v){document.querySelectorAll(".pin").forEach(p=>p.style.display=v==="All Events"||p.dataset.e===v?"block":"none")}
function toast(m){let x=document.createElement("div");x.className="toast";x.textContent=m;document.body.appendChild(x);setTimeout(()=>x.remove(),3200)}
home();
</script></body></html>
